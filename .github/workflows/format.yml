name: Format check

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  format-check:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Setup bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest
    - name: Install dependencies
      run: bun install
    - name: Check formatting
      run: bun run format:check